<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to ParkSense — smart parking garage management portal.">
  <title>ParkSense — Attendant Sign In</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/png" href="/img/logo.png">
</head>
<body>

  <!-- Persistent Multi-Page Navigation Bar -->
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="/" class="navbar-brand">
        <img src="/img/logo.png" alt="ParkSense Logo" class="brand-logo-img">
      </a>
      <div class="navbar-links">
        <a href="/" data-i18n="nav_home">Home</a>
        <a href="/map.html" data-i18n="nav_live_map">Live Spot Map</a>
        <a href="/rates.html" data-i18n="nav_rates">Rates &amp; Estimator</a>
        <a href="/dashboard.html" data-i18n="nav_attendant_hub">Attendant Hub</a>
        <a href="/login.html" class="active" data-i18n="nav_sign_in">Sign In</a>

        <!-- Language Switcher -->
        <div class="lang-switcher">
          <button id="langEnBtn" class="lang-btn active">EN</button>
          <button id="langHiBtn" class="lang-btn">हिंदी</button>
        </div>
      </div>
    </div>
  </nav>

  <div class="auth-page" style="min-height: calc(100vh - 140px);">
    <div class="auth-card">
      <div style="text-align: center; margin-bottom: 24px;">
        <img src="/img/logo.png" alt="ParkSense Logo" style="height: 52px; width: auto; display: inline-block;">
      </div>
      <h2 class="text-center" style="font-family: var(--font-display); margin-bottom: 6px; font-weight: 800; font-size: 1.8rem;">ParkSense Portal</h2>
      <p class="text-center text-muted text-sm" style="margin-bottom: 28px;">Attendant Authentication</p>

      <!-- Toggle Tabs -->
      <div class="auth-toggle">
        <button id="loginTab" class="active" data-i18n="nav_sign_in">Sign In</button>
        <button id="registerTab">Create Account</button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="auth-form active">
        <div id="loginError" class="auth-error"></div>
        
        <div class="form-group">
          <label class="neu-label" for="loginUsername">Username</label>
          <input type="text" id="loginUsername" class="neu-input" placeholder="Enter username (e.g. admin)" autocomplete="username" required>
        </div>

        <div class="form-group">
          <label class="neu-label" for="loginPassword">Password</label>
          <input type="password" id="loginPassword" class="neu-input" placeholder="Enter password (e.g. admin123)" autocomplete="current-password" required>
        </div>

        <button type="submit" class="neu-btn neu-btn-red" style="width: 100%; margin-top: 14px; display: flex; justify-content: center; align-items: center; gap: 8px;">
          <span data-i18n="nav_sign_in">Sign In</span>
          <svg class="icon" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
      </form>

      <!-- Register Form -->
      <form id="registerForm" class="auth-form">
        <div id="registerError" class="auth-error"></div>
        
        <div class="form-group">
          <label class="neu-label" for="registerName">Full Name</label>
          <input type="text" id="registerName" class="neu-input" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
          <label class="neu-label" for="registerUsername">Username</label>
          <input type="text" id="registerUsername" class="neu-input" placeholder="Choose a username" autocomplete="username" required>
        </div>

        <div class="form-group">
          <label class="neu-label" for="registerPassword">Password</label>
          <input type="password" id="registerPassword" class="neu-input" placeholder="Min. 6 characters" autocomplete="new-password" required>
        </div>

        <div class="form-group">
          <label class="neu-label" for="registerConfirmPassword">Confirm Password</label>
          <input type="password" id="registerConfirmPassword" class="neu-input" placeholder="Repeat your password" autocomplete="new-password" required>
        </div>

        <button type="submit" class="neu-btn neu-btn-red" style="width: 100%; margin-top: 14px; display: flex; justify-content: center; align-items: center; gap: 8px;">
          <span>Create Account</span>
          <svg class="icon" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
        </button>
      </form>

      <p class="text-center text-muted text-sm" style="margin-top: 28px;">
        <a href="/" style="display: inline-flex; align-items: center; gap: 6px;">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          Back to Home Page
        </a>
      </p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
